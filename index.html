    <script>
      // Ensure window.fetch has both getter and setter for external tooling / iframe script compatibility
      (function() {
        try {
          var originalFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : window.fetch;
          var _fetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if environment prevents redefining
        }
      })();
    </script>
